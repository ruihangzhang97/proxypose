# Self-contained fly-physics config — run with:
#   python blender_datagen_compose.py --config configs/render_fly_physics.yaml

# base_path defaults to the small bundled demo objects so this config runs out of
# the box. For real generation, point it at your own asset library instead (e.g. a
# downloaded Objaverse subset) — data/objects/ is an empty placeholder for that.
out_dir: output/fly_physics
base_path: data/toy_objects/*/
envlight: data/envmaps

seed: 359
num_rendering: 1
num_frames: 64
num_lighting: 1

resolution: [512, 512]
spp: 64
use_denoise: OPENIMAGEDENOISE
env_scale: 1.0
bg_color: [0, 0, 0]
transparent_bg: false

dump_video: true
dump_features: true
dump_alpha: true
dump_envmap: false
dump_ball_env: false
dump_env_bg: false
dump_complete: false
dump_blend: false

random_env_rotation: true
random_env_flip: true
random_env_scale: [0.7, 1.4]

video_mode: arbitrary_motion
skip_placement_plane: true

glbs_per_scene: 2
shapes_per_scene: 0
glbs_check_bbox: true
glbs_rescale: true
glbs_scale_range: [0.7, 0.9]
glbs_rotation_range: [-45, 45]
glbs_placement_bbox: [-1.0, -1.0, 1.0, 1.0]

cam_phi_range: [0, 360]
cam_theta_range: [5, 60]
cam_t_range: [0, 0]
fov_range: [45, 45]
radius_range: [3.0, 3.8]

spawn:
  mode: edges
  region:
    center: [0.0, 0.0, 0.5]
    size: [1.2, 1.2, 0.6]
  min_separation: 0.08
  retries: 50

camera_motion:
  max_azimuth_drift: 0
  max_elevation_drift: 0
  max_radius_drift: 0

initial_motion:
  speed_range: [3.0, 6.0]
  downward_bias: 0.0
  angular_speed_range: [30.0, 90.0]

physics:
  gravity: [0.0, 0.0, 0.0]
  restitution_range: [0.6, 0.95]
